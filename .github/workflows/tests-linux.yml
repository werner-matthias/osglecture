name: Tests · Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-directlua:
    name: Lint · \directlua catcode safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint \directlua call sites
        run: |
          find . \( -name build -o -name .git -o -path '*/vendor/*' \) -prune -o \
            -type f \( -name '*.dtx' -o -name '*.sty' -o -name '*.cls' \
                       -o -name '*.tex' -o -name '*.lvt' \) -print0 \
            | xargs -0 --no-run-if-empty perl .github/scripts/lint-directlua.pl

  install-smoke:
    name: Bundle installation · Current TeX Live
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: texlive/texlive:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show environment
        run: |
          lualatex --version
          l3build version

      - name: Install, locate, compile, and uninstall
        run: bash .github/scripts/install-smoke-test.sh

  test:
    name: ${{ matrix.module }} · Current TeX Live
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        module:
          - ollm
          - osgdoc
          - langselect
          - lttheme
          - lttheme-tuc-2019
          - osgstyler
          - osglecture-modes
          - osglecture
          - tagpax
          - semcat

    container:
      image: texlive/texlive:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show environment
        run: |
          lualatex --version
          l3build version

      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: l3build check

      - name: Show test differences
        if: failure()
        shell: bash
        run: |
          if [[ ! -d build/test ]]; then
            echo "No build/test directory was produced."
            exit 0
          fi

          while IFS= read -r file; do
            echo "::group::$file"
            sed -n '1,500p' "$file"
            echo "::endgroup::"
          done < <(find build/test -type f -name '*.diff' -print)

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures-${{ matrix.module }}-Linux
          path: |
            build/test/*.diff
            build/test/*.log
            build/test/*.pdf
          if-no-files-found: warn
          retention-days: 14
