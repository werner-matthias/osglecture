name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: Bundle installation · Current TeX Live
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: texlive/texlive:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show environment
        run: |
          lualatex --version
          l3build version

      - name: Install, locate, compile, and uninstall
        run: bash .github/scripts/install-smoke-test.sh

  test:
    name: ${{ matrix.module }} · Current TeX Live
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        module:
          - ollm
          - osgdoc
          - langselect
          - lttheme
          - lttheme-tuc-2019
          - osglecture-modes
          - osglecture
          - tagpax

    container:
      image: texlive/texlive:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show environment
        run: |
          lualatex --version
          l3build version

      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: l3build check

      - name: Show test differences
        if: failure()
        shell: bash
        run: |
          if [[ ! -d build/test ]]; then
            echo "No build/test directory was produced."
            exit 0
          fi

          while IFS= read -r file; do
            echo "::group::$file"
            sed -n '1,500p' "$file"
            echo "::endgroup::"
          done < <(find build/test -type f -name '*.diff' -print)

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures-${{ matrix.module }}
          path: |
            build/test/*.diff
            build/test/*.log
            build/test/*.pdf
          if-no-files-found: warn
          retention-days: 14

  portability:
    name: ${{ matrix.os }} · Current TeX Live
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          cache_version: 1
          packages: >
            scheme-small
            l3build
            latex-bin
            luatex
            luaotfload
            latexmk
            collection-latexrecommended
            collection-latexextra
            collection-luatex
            collection-fontsrecommended
            collection-pictures
            collection-langenglish
            collection-langgerman
            ltx-talk
            tagpdf
            show-pdf-tags
            fontawesome5
            dejavu
            newcomputermodern

      - name: Show environment
        run: |
          lualatex --version
          l3build version

      - name: Test bundle
        run: l3build check

      - name: Test bundle installation on macOS
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-smoke-test.sh

      - name: Test bundle installation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install-smoke-test.ps1

      - name: Show test differences
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build/test)) {
            Write-Output "No build/test directory was produced."
            exit 0
          }

          Get-ChildItem build/test -Filter *.diff -File | ForEach-Object {
            Write-Output "::group::$($_.FullName)"
            Get-Content $_.FullName -TotalCount 500
            Write-Output "::endgroup::"
          }

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures-${{ runner.os }}
          path: |
            build/test/*.diff
            build/test/*.log
            build/test/*.pdf
          if-no-files-found: warn
          retention-days: 14
