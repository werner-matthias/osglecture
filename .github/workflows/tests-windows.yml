name: Tests · Windows

# Manual dispatch only: the Windows runner has a longstanding, unresolved
# path-handling bug (see the "Debug session" step below) that fails on
# essentially every push, which used to spam failure notifications without
# giving new information. Trigger by hand from the Actions tab when actually
# investigating that bug; the status badge still reflects the most recent
# such run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · Current TeX Live
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          cache_version: 2
          packages: >
            scheme-small
            l3build
            latex-bin
            luatex
            luaotfload
            latexmk
            collection-latexrecommended
            collection-latexextra
            collection-luatex
            collection-fontsrecommended
            collection-pictures
            collection-langenglish
            collection-langgerman
            ltx-talk
            tagpdf
            show-pdf-tags
            fontawesome5
            dejavu
            newcomputermodern

      - name: Show environment
        run: |
          lualatex --version
          l3build version
          Write-Output "--- book.cls / kernel version check ---"
          $bookCls = & kpsewhich book.cls
          Write-Output "book.cls path: $bookCls"
          Get-Content $bookCls -TotalCount 50 | Select-String "ProvidesClass"
          $latexLtx = & kpsewhich latex.ltx
          Write-Output "latex.ltx path: $latexLtx"
          Get-Content $latexLtx | Select-String "edef.fmtversion" -Context 0,1

      # Manual-dispatch-only interactive debug session: run this workflow
      # via workflow_dispatch (not push/pull_request) to get an SSH shell
      # on the actual Windows runner, in the same state as CI, right before
      # the test step runs. Uses ngrok (not tmate.io, whose free relay
      # servers are being shut down and fail intermittently with
      # "Internal error"). Remove once the Windows-specific bug is
      # resolved; not meant to run on every push.
      - name: Debug session
        if: github.event_name == 'workflow_dispatch'
        uses: luchihoratiu/debug-via-ssh@main
        with:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          NGROK_TIMEOUT: 1800

      - name: Test bundle
        run: l3build check

      - name: Test bundle installation
        shell: pwsh
        run: ./.github/scripts/install-smoke-test.ps1

      - name: Show test differences
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build/test)) {
            Write-Output "No build/test directory was produced."
            exit 0
          }

          Get-ChildItem build/test -Filter *.diff -File | ForEach-Object {
            Write-Output "::group::$($_.FullName)"
            Get-Content $_.FullName -TotalCount 500
            Write-Output "::endgroup::"
          }

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures-Windows
          path: |
            build/test/*.diff
            build/test/*.log
            build/test/*.pdf
          if-no-files-found: warn
          retention-days: 14
