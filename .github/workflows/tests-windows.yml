name: Tests · Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: >
          Open an interactive SSH session on the runner before the tests run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · Current TeX Live
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          cache_version: 2
          packages: >
            scheme-small
            l3build
            latex-bin
            luatex
            luaotfload
            latexmk
            collection-latexrecommended
            collection-latexextra
            collection-luatex
            collection-fontsrecommended
            collection-pictures
            collection-langenglish
            collection-langgerman
            ltx-talk
            tagpdf
            show-pdf-tags
            fontawesome5
            dejavu
            newcomputermodern

      # qpdf is not part of TeX Live; ollm deploy needs it to restrict PDF
      # permissions, and its tests skip the real encryption without it. The
      # Chocolatey package unpacks qpdf below its lib directory; its bin
      # directory (with the DLLs next to qpdf.exe) goes on PATH for later
      # steps instead of relying on the Chocolatey shim.
      - name: Install qpdf
        shell: pwsh
        run: |
          choco install qpdf --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install qpdf failed" }
          $root = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $qpdf = Get-ChildItem (Join-Path $root 'lib\qpdf') -Recurse -Filter qpdf.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $qpdf) { throw "qpdf.exe was not found below $root\lib\qpdf" }
          $qpdf.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $qpdf.FullName --version

      - name: Show environment
        run: |
          lualatex --version
          l3build version

      # Opt-in interactive debug session: dispatch with debug=true to get an
      # SSH shell on the actual Windows runner, in the same state as CI,
      # right before the test step runs. It blocks the job for up to
      # NGROK_TIMEOUT seconds, so it stays off by default -- a plain
      # dispatch runs the tests straight through. Uses ngrok (not tmate.io,
      # whose free relay servers are being shut down and fail
      # intermittently with "Internal error").
      - name: Debug session
        if: inputs.debug
        uses: luchihoratiu/debug-via-ssh@main
        with:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          NGROK_TIMEOUT: 1800

      - name: Test bundle
        run: l3build check

      - name: Test bundle installation
        shell: pwsh
        run: ./.github/scripts/install-smoke-test.ps1

      - name: Show test differences
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build/test)) {
            Write-Output "No build/test directory was produced."
            exit 0
          }

          Get-ChildItem build/test -Filter *.diff -File | ForEach-Object {
            Write-Output "::group::$($_.FullName)"
            Get-Content $_.FullName -TotalCount 500
            Write-Output "::endgroup::"
          }

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures-Windows
          path: |
            build/test/*.diff
            build/test/*.log
            build/test/*.pdf
          if-no-files-found: warn
          retention-days: 14
