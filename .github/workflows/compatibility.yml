name: Distribution compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-sync:
    name: Compatibility table is synchronized
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Regenerate bundle manifest
        run: |
          cp README.md /tmp/osglecture-readme-before-generation.md
          texlua tools/update-bundle-manifest.lua

      - name: Check generated compatibility table
        run: diff -u /tmp/osglecture-readme-before-generation.md README.md

  compatibility:
    name: ${{ matrix.component.name }} · TeX Live ${{ matrix.distribution.texlive }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        component:
          - name: ansiterm
            directory: ansiterm
            config: build
            expect_2024: pass
            expect_2025: pass
            expect_current: pass
          - name: osglistings
            directory: osglistings
            config: build
            expect_2024: pass
            expect_2025: pass
            expect_current: pass
          - name: ollm
            directory: ollm
            config: build
            expect_2024: n/a
            expect_2025: pass
            expect_current: pass
          - name: osgdoc
            directory: osgdoc
            config: build
            expect_2024: pass
            expect_2025: pass
            expect_current: pass
          - name: langselect
            directory: langselect
            config: build
            expect_2024: pass
            expect_2025: pass
            expect_current: pass
          - name: osgstyler
            directory: osgstyler
            config: build
            expect_2024: fail
            expect_2025: fail
            expect_current: pass
          - name: lttheme
            directory: lttheme
            config: build
            expect_2024: fail
            expect_2025: fail
            expect_current: pass
          - name: lttheme-tuc-2019
            directory: lttheme-tuc-2019
            config: build
            expect_2024: fail
            expect_2025: fail
            expect_current: pass
          - name: osglecture-modes-core
            directory: osglecture-modes
            config: core
            expect_2024: pass
            expect_2025: pass
            expect_current: pass
          - name: ltx-talk support (osglecture + osglecture-modes)
            directory: osglecture-modes
            config: ltxtalk
            companion_directory: ../osglecture
            companion_config: ltxtalk
            expect_2024: fail
            expect_2025: fail
            expect_current: pass
          - name: osglecture
            directory: osglecture
            config: core
            expect_2024: fail
            expect_2025: pass
            expect_current: pass
          - name: tagpax
            directory: tagpax
            config: build
            expect_2024: pass
            expect_2025: pass
            expect_current: pass
        distribution:
          - texlive: "2024"
            image: texlive/texlive:TL2024-historic
          - texlive: "2025"
            image: texlive/texlive:TL2025-historic
          - texlive: current
            image: texlive/texlive:latest

    container:
      image: ${{ matrix.distribution.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve compatibility expectation
        id: expected
        shell: bash
        env:
          TEXLIVE: ${{ matrix.distribution.texlive }}
          EXPECT_2024: ${{ matrix.component.expect_2024 }}
          EXPECT_2025: ${{ matrix.component.expect_2025 }}
          EXPECT_CURRENT: ${{ matrix.component.expect_current }}
        run: |
          case "$TEXLIVE" in
            2024) expected="$EXPECT_2024" ;;
            2025) expected="$EXPECT_2025" ;;
            current) expected="$EXPECT_CURRENT" ;;
            *)
              echo "::error::No compatibility expectation configured for TeX Live $TEXLIVE."
              exit 1
              ;;
          esac
          echo "value=$expected" >> "$GITHUB_OUTPUT"

      - name: Show environment
        if: steps.expected.outputs.value != 'n/a'
        run: |
          lualatex --version
          l3build version

      - name: Test ${{ matrix.component.name }}
        id: compatibility-test
        if: steps.expected.outputs.value != 'n/a'
        continue-on-error: true
        working-directory: ${{ matrix.component.directory }}
        env:
          COMPANION_DIRECTORY: ${{ matrix.component.companion_directory }}
          COMPANION_CONFIG: ${{ matrix.component.companion_config }}
        run: |
          l3build check --config ${{ matrix.component.config }}
          if [[ -n "$COMPANION_DIRECTORY" ]]; then
            (
              cd "$COMPANION_DIRECTORY"
              l3build check --config "$COMPANION_CONFIG"
            )
          fi

      - name: Compare result with compatibility expectation
        id: expectation
        if: always()
        shell: bash
        env:
          ACTUAL: ${{ steps.compatibility-test.outcome }}
          TEXLIVE: ${{ matrix.distribution.texlive }}
          EXPECTED: ${{ steps.expected.outputs.value }}
        run: |
          if [[ "$EXPECTED" == "n/a" ]]; then
            if [[ "$ACTUAL" != "skipped" ]]; then
              echo "::error::A non-applicable compatibility test unexpectedly ran (outcome: $ACTUAL)."
              exit 1
            fi
            echo "Not applicable for TeX Live $TEXLIVE; test skipped."
            exit 0
          fi

          case "$ACTUAL" in
            success) actual=pass ;;
            failure) actual=fail ;;
            *)
              echo "::error::Compatibility test ended with unexpected outcome '$ACTUAL'."
              exit 1
              ;;
          esac

          echo "Expected: $EXPECTED"
          echo "Actual:   $actual"

          if [[ "$actual" != "$EXPECTED" ]]; then
            echo "::error::Compatibility changed for ${{ matrix.component.name }} on TeX Live $TEXLIVE: expected $EXPECTED, observed $actual."
            exit 1
          fi

          echo "Compatibility matches the recorded expectation."

      - name: Show test differences
        if: always() && steps.compatibility-test.outcome == 'failure'
        shell: bash
        run: |
          test_dir="build/test"
          if [[ "${{ matrix.component.config }}" != "build" ]]; then
            test_dir="build/test-${{ matrix.component.config }}"
          fi
          if [[ ! -d "$test_dir" ]]; then
            echo "No build/test directory was produced."
            exit 0
          fi

          while IFS= read -r file; do
            echo "::group::$file"
            sed -n '1,500p' "$file"
            echo "::endgroup::"
          done < <(find "$test_dir" -type f -name '*.diff' -print)

      - name: Upload failed test output
        if: always() && steps.expectation.outcome == 'failure' && steps.compatibility-test.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-${{ matrix.component.name }}-tl${{ matrix.distribution.texlive }}
          path: |
            build/test*/*.diff
            build/test*/*.log
            build/test*/*.pdf
          if-no-files-found: warn
          retention-days: 7
