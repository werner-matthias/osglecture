schema = 1
bundle_preset = "OSG lecture/1"

[project]
id = "example"
title = "Minimal configuration example"

[project.tex]
directory = "Include"
config = "projectconfig.tex"

[languages]
available = ["de", "en"]
default = "de"

[languages.map]
de = "ngerman"
en = "british"

[targets.slides]
languages = ["de"]

[targets.script]
languages = ["de", "en"]

[security]
shell_escape = "restricted"
